<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to TubeMind</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo-256.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="wrap nav">
    <a class="logo" href="./"><img src="assets/logo-256.png" alt=""> TubeMind</a>
    <nav class="lang-switch"><a data-set-lang="en">en</a><a data-set-lang="de">de</a><a data-set-lang="fr">fr</a><a data-set-lang="it">it</a></nav>
  </div>

  <main class="page">
    <div class="card">
      <h1 data-t="wTitle">TubeMind is installed 🎉</h1>
      <p data-t="wText">Open any YouTube video and try these three things:</p>
      <ol class="steps">
        <li><div><strong><kbd>S</kbd> <span data-t="w1t"></span></strong><span data-t="w1d"></span></div></li>
        <li><div><strong><kbd>N</kbd> <span data-t="w2t"></span></strong><span data-t="w2d"></span></div></li>
        <li><div><strong>✨ <span data-t="w3t"></span></strong><span data-t="w3d"></span></div></li>
      </ol>
      <p class="note" data-t="wPin"></p>
      <div class="cta" style="justify-content:flex-start">
        <a class="btn btn-primary" href="https://www.youtube.com/" data-t="wCta">Open YouTube</a>
        <a class="btn" data-link="donate" href="#" target="_blank" rel="noopener">❤️ <span data-t="donate"></span></a>
      </div>
    </div>

    <div class="ad-slot" data-slot="welcome"><div class="ad-label" data-t="adLabel">Advertisement</div></div>
  </main>

  <footer>
    <div class="wrap">
      <span>© TubeMind · <span data-t="footerNote"></span></span>
      <span><a href="privacy.html" data-t="footerPrivacy">Privacy policy</a></span>
    </div>
  </footer>

  <script src="assets/site-config.js"></script>
  <script src="assets/texts.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
